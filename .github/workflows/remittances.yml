# Twice a month: read the World Bank's Remittance Prices Worldwide dataset (published quarterly) and commit the
# cost of sending money to each African country, corridor by corridor. Writes only when a new quarter appears.
name: Remittance prices

on:
  schedule:
    - cron: "23 6 1,15 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests openpyxl
      - run: python scripts/remittance_prices.py
      - name: Commit if the dataset changed
        run: |
          if git diff --quiet -- data && [ -z "$(git ls-files --others --exclude-standard data)" ]; then
            echo "No new quarter."
            exit 0
          fi
          git config user.name "afronomics-bot"
          git config user.email "afronomics-bot@users.noreply.github.com"
          git add data
          git commit -m "Remittance prices: latest quarter"
          branch="${GITHUB_REF_NAME}"
          for attempt in 1 2 3; do
            # Another run may have committed the same files meanwhile: this run read them last, so its copy of
            # any file both changed wins; files only one run changed merge as usual.
            if ! git pull --rebase origin "$branch"; then
              for f in $(git diff --name-only --diff-filter=U); do git checkout --theirs -- "$f" && git add "$f"; done
              GIT_EDITOR=true git rebase --continue || { git rebase --abort 2>/dev/null; false; }
            fi && git push origin "HEAD:$branch" && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 10))
          done
          exit 1
