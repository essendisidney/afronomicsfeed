# Every weekday, three times: read new central-bank auction results for each market and commit the datasets.
# The commit triggers a Vercel deploy, so the site updates itself. No secrets are needed.
# Auction days differ (Egypt Sun-Mon, Malawi Tue, Nigeria/Tanzania/Mozambique Wed, Kenya/Zambia Thu, Ghana/South Africa Fri),
# so running every weekday keeps each market within hours of its central bank's release.
name: African auctions

on:
  schedule:
    - cron: "17 7 * * 1-5"  # 10:17 Nairobi
    - cron: "17 12 * * 1-5" # 15:17 Nairobi
    - cron: "47 15 * * 1-5" # 18:47 Nairobi, after late-afternoon postings
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pdfplumber requests openpyxl
      - run: python scripts/kenya_tbills.py
      - run: python scripts/kenya_bonds.py
      # Each market is independent: one publisher being down must not stop the others.
      - run: python scripts/nigeria_tbills.py
        continue-on-error: true
        timeout-minutes: 5
      - run: python scripts/ghana_tbills.py
        continue-on-error: true
        timeout-minutes: 10
      - run: python scripts/tanzania_tbills.py
        continue-on-error: true
        timeout-minutes: 8
      - run: python scripts/egypt_tbills.py
        continue-on-error: true
        timeout-minutes: 6
      - run: python scripts/southafrica_tbills.py
        continue-on-error: true
        timeout-minutes: 6
      - run: python scripts/mozambique_tbills.py
        continue-on-error: true
        timeout-minutes: 8
      - run: python scripts/zambia_tbills.py
        continue-on-error: true
        timeout-minutes: 10
      - run: python scripts/malawi_tbills.py
        continue-on-error: true
        timeout-minutes: 10
      # Uganda is not run here: the Bank of Uganda's site does not answer GitHub's network.
      # scripts/uganda_tbills.py runs from a machine in the region instead.
      - name: Commit if the dataset changed
        run: |
          if git diff --quiet -- data && [ -z "$(git ls-files --others --exclude-standard data)" ]; then
            echo "No new auctions."
            exit 0
          fi
          git config user.name "afronomics-bot"
          git config user.email "afronomics-bot@users.noreply.github.com"
          git add data
          git commit -m "African auctions: add latest results"
          git push
