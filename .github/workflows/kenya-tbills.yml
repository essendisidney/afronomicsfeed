# Weekly: read new Central Bank of Kenya Treasury bill result notices and commit the updated dataset.
# The commit triggers a Vercel deploy, so the site updates itself. No secrets are needed.
name: African auctions (Kenya, Nigeria, Ghana, Tanzania)

on:
  schedule:
    - cron: "30 13 * * 4" # Thursday 16:30 Nairobi, after the CBK posts T-bill results
    - cron: "30 13 * * 3" # Wednesday 16:30 Nairobi, bond results usually land mid-week
    - cron: "30 7 * * 5"  # Friday 10:30 Nairobi, catches late postings
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pdfplumber requests
      - run: python scripts/kenya_tbills.py
      - run: python scripts/kenya_bonds.py
      # Each market is independent: one publisher being down must not stop the others.
      - run: python scripts/nigeria_tbills.py
        continue-on-error: true
        timeout-minutes: 5
      - run: python scripts/ghana_tbills.py
        continue-on-error: true
        timeout-minutes: 10
      - run: python scripts/tanzania_tbills.py
        continue-on-error: true
        timeout-minutes: 8
      # Uganda is not run here: the Bank of Uganda's site does not answer GitHub's network.
      # scripts/uganda_tbills.py runs from a machine in the region instead.
      - name: Commit if the dataset changed
        run: |
          if git diff --quiet -- data && [ -z "$(git ls-files --others --exclude-standard data)" ]; then
            echo "No new auctions."
            exit 0
          fi
          git config user.name "afronomics-bot"
          git config user.email "afronomics-bot@users.noreply.github.com"
          git add data
          git commit -m "African auctions: add latest results"
          git push
