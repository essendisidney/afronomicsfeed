# Manual only: print what publishers' pages say, to write or fix a reader when the desk machine cannot reach
# them. Read-only: it commits nothing.
name: Probe

on:
  workflow_dispatch:
    inputs:
      pattern:
        description: "Regex to show context for"
        default: "yield|rate"
      urls:
        description: "Space-separated URLs"
        required: true
      links:
        description: "Also list links whose text or address matches (1 = yes)"
        default: ""
      full:
        description: "Print a PDF's full text, page by page (1 = yes)"
        default: ""
      raw:
        description: "Also search the raw HTML (1 = yes)"
        default: ""
      pages:
        description: "PDF pages to print, e.g. 170-188,96 (at most 80)"
        default: ""
      layout:
        description: "Keep column positions when printing pages (1 = yes)"
        default: ""

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pdfplumber
      - run: python scripts/probe.py "$PATTERN" $URLS
        env:
          PATTERN: ${{ inputs.pattern }}
          URLS: ${{ inputs.urls }}
          PROBE_LINKS: ${{ inputs.links }}
          PROBE_FULL: ${{ inputs.full }}
          PROBE_RAW: ${{ inputs.raw }}
          PROBE_PAGES: ${{ inputs.pages }}
          PROBE_LAYOUT: ${{ inputs.layout }}
      - name: OCR (layout = ocr)
        if: inputs.layout == 'ocr'
        run: |
          sudo apt-get install -y -qq tesseract-ocr >/dev/null && pip install -q pytesseract
          python -c "import sys,requests; sys.path.insert(0,'scripts'); import uganda_tbills as u; [print('=== OCR', x, chr(10) + u.ocr_text(requests.get(x, timeout=60).content)) for x in sys.argv[1:]]" $URLS
        env:
          URLS: ${{ inputs.urls }}
