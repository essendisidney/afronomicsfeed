# Save copies of publishers' documents into tests/readers/fixtures/<folder>/ on a feature branch, so a new reader can
# be tested offline against the real thing when the desk machine cannot reach the publisher. Never runs on main.
# Two ways to start it: push a request file tests/readers/fixtures/<folder>.request (one "name=url" per line) to a
# feature branch, or run it by hand once this file is on main.
name: Save reader fixtures

on:
  push:
    branches-ignore: [main]
    paths: ["tests/readers/fixtures/*.request"]
  workflow_dispatch:
    inputs:
      files:
        description: "Space-separated name=url pairs, e.g. sasra_list_2026.pdf=https://www.sasra.go.ke/?wpdmdl=1573"
        required: true
      folder:
        description: "Sub-folder of tests/readers/fixtures/ (letters, digits, _ and -)"
        required: true

permissions:
  contents: write

jobs:
  save:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Download
        env:
          FILES: ${{ inputs.files }}
          FOLDER: ${{ inputs.folder }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "push" ]; then
            # Every request file changed in this push; one folder per run keeps it simple.
            req=$(git diff --name-only --diff-filter=AM HEAD~1 HEAD -- 'tests/readers/fixtures/*.request' | head -1)
            [ -n "$req" ] || { echo "no request file changed"; exit 0; }
            FOLDER=$(basename "$req" .request)
            FILES=$(grep -v '^#' "$req" | tr '\n' ' ')
          fi
          echo "FOLDER=$FOLDER" >> "$GITHUB_ENV"
          if ! [[ "$FOLDER" =~ ^[a-z0-9_-]+$ ]]; then echo "bad folder"; exit 1; fi
          dir="tests/readers/fixtures/$FOLDER"
          mkdir -p "$dir"
          for pair in $FILES; do
            name="${pair%%=*}"; url="${pair#*=}"
            if ! [[ "$name" =~ ^[a-z0-9_.-]+$ ]] || [[ "$name" == .* ]]; then echo "bad name $name"; exit 1; fi
            if ! [[ "$url" =~ ^https:// ]]; then echo "bad url for $name"; exit 1; fi
            curl -fsSL --retry 3 --max-time 120 -A "Mozilla/5.0 (Afronomics fixture saver)" -o "$dir/$name" "$url"
            size=$(stat -c %s "$dir/$name")
            if [ "$size" -gt 20000000 ]; then echo "$name is over 20 MB"; rm "$dir/$name"; exit 1; fi
            echo "$name: $size bytes from $url"
          done
      - name: Commit to this branch
        run: |
          git config user.name "afronomics-bot"
          git config user.email "afronomics-bot@users.noreply.github.com"
          git add "tests/readers/fixtures/$FOLDER"
          git diff --cached --quiet && { echo "nothing new"; exit 0; }
          git commit -m "Reader fixtures: $FOLDER"
          git push origin "HEAD:${GITHUB_REF_NAME}"
