# Twice a day: write the next Kenya Treasury bill auction's ranges to the forecast ledger if they are due (always
# before bids close on Thursday, 14:00 Nairobi), and grade any forecast whose CBK result is in
# (docs/rebuild/phase-4-plan.md). The commit to this public repository is the forecast's time stamp. The ledger only
# grows; the script refuses a forecast written after bids close.
name: Forecast ledger

on:
  schedule:
    - cron: "7 6 * * *" # 09:07 Nairobi
    - cron: "37 15 * * *" # 18:37 Nairobi, after Thursday's results
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: forecast-ledger
  cancel-in-progress: false

jobs:
  ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/forecast_ledger.py
      - name: Commit the ledger if it grew
        run: |
          if git diff --quiet -- data/forecasts && [ -z "$(git ls-files --others --exclude-standard data/forecasts)" ]; then
            echo "Nothing due."
            exit 0
          fi
          git config user.name "afronomics-bot"
          git config user.email "afronomics-bot@users.noreply.github.com"
          git add data/forecasts
          git commit -m "Forecast ledger: Kenya T-bill ranges and outcomes"
          for attempt in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 10))
          done
          exit 1
