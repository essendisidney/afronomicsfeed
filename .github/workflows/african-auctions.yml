# Every two hours on weekdays (07:17 to 21:17 Nairobi) and every four hours at weekends: read new central-bank
# auction results for each market and commit the datasets. GitHub starts scheduled runs late or drops them when it
# is busy (in Oct 2026 the morning run never ran and the others started hours late), so runs are frequent: a run
# with nothing new commits nothing. The commit triggers a Vercel deploy, so the site updates itself. The last step
# sends email rate alerts, then bond-result alerts (need AF_CRON_SECRET; without it they skip) and sends only what is new.
# Auction days differ (Egypt Sun-Mon, Malawi Tue, Nigeria/Tanzania/Mozambique Wed, Kenya/Zambia Thu, Ghana/South Africa Fri).
name: African auctions

on:
  schedule:
    - cron: "17 4-18/2 * * 1-5" # every two hours, 07:17 to 21:17 Nairobi, weekdays
    - cron: "17 5-17/4 * * 0,6" # 08:17, 12:17, 16:17, 20:17 Nairobi at weekends
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: african-auctions
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pdfplumber requests openpyxl
      # Each market is independent: one publisher being down must not stop the others.
      # (A CBK timeout on 13 Oct used to abort every market, the rates and the commit.)
      - run: python scripts/kenya_tbills.py
        continue-on-error: true
        timeout-minutes: 10
      - run: python scripts/kenya_bonds.py
        continue-on-error: true
        timeout-minutes: 10
      - run: python scripts/nigeria_tbills.py
        continue-on-error: true
        timeout-minutes: 5
      - run: python scripts/ghana_tbills.py
        continue-on-error: true
        timeout-minutes: 10
      - run: python scripts/tanzania_tbills.py
        continue-on-error: true
        timeout-minutes: 8
      - run: python scripts/egypt_tbills.py
        continue-on-error: true
        timeout-minutes: 6
      - run: python scripts/southafrica_tbills.py
        continue-on-error: true
        timeout-minutes: 6
      - run: python scripts/mozambique_tbills.py
        continue-on-error: true
        timeout-minutes: 8
      - run: python scripts/zambia_tbills.py
        continue-on-error: true
        timeout-minutes: 10
      - run: python scripts/malawi_tbills.py
        continue-on-error: true
        timeout-minutes: 10
      # Government bond auctions in the JPMorgan GBI-EM Edge markets (the index holds bonds, not bills).
      - run: python scripts/zambia_bonds.py
        continue-on-error: true
        timeout-minutes: 10
      - run: python scripts/egypt_bonds.py
        continue-on-error: true
        timeout-minutes: 8
      # Morocco: the Treasury's weekly auction result PDFs (finances.gov.ma); only new PDFs are downloaded.
      - run: python scripts/morocco_bonds.py
        continue-on-error: true
        timeout-minutes: 8
      # Nigeria: the DMO's monthly FGN bond auction summaries (PDF, from 2013); only new summaries are downloaded.
      - run: python scripts/nigeria_bonds.py
        continue-on-error: true
        timeout-minutes: 10
      # The eight WAEMU markets (Cote d'Ivoire, Senegal and six more) from UMOA-Titres: bills and bonds. Each run
      # reads up to 250 issue pages it has not read, newest first, so the history back to 2017 fills over a few runs.
      - run: python scripts/umoa_bonds.py
        continue-on-error: true
        timeout-minutes: 12
      - run: python scripts/kenya_rates.py
        continue-on-error: true
        timeout-minutes: 5
      - run: python scripts/policy_rates.py
        continue-on-error: true
        timeout-minutes: 5
      # Kenya's next MPC date, from the CBK's own "next MPC meeting" notice, onto the decision calendar.
      - run: python scripts/kenya_mpc.py
        continue-on-error: true
        timeout-minutes: 3
      # What banks pay and charge in Nigeria (CBN) and Ghana (Bank of Ghana), for their "Is my rate fair?" checks.
      - run: python scripts/west_africa_rates.py
        continue-on-error: true
        timeout-minutes: 5
      - run: python scripts/nigeria_savings_bond.py
        continue-on-error: true
        timeout-minutes: 5
      # Nigeria's (DMO daily report) and Kenya's (CBK Weekly Bulletin, Table 6) Eurobond yields.
      - run: python scripts/eurobonds.py
        continue-on-error: true
        timeout-minutes: 8
      # Every Kenyan money market fund's size, from the CMA's quarterly report: writes only when a new quarter appears.
      - run: python scripts/cma_mmf.py
        continue-on-error: true
        timeout-minutes: 5
      # Kenya's licensed loan apps (digital credit providers), from the CBK's monthly directory: writes only when a
      # new directory appears, and records lenders that drop off the list.
      - run: python scripts/kenya_dcp.py
        continue-on-error: true
        timeout-minutes: 5
      # Kenya's open government tenders, from the procurement regulator's OCDS open data on tenders.go.ke.
      - run: python scripts/kenya_tenders.py
        continue-on-error: true
        timeout-minutes: 8
      # Uganda (bills, then bonds): the Bank of Uganda's content API now answers GitHub's network. Recent notices are images, read
      # with Tesseract OCR and kept only when every figure passes the notice's own cross-checks.
      - name: Uganda T-bills
        run: |
          sudo apt-get install -y -qq tesseract-ocr >/dev/null && pip install -q pytesseract
          python scripts/uganda_tbills.py --budget 600
          python scripts/uganda_bonds.py || echo "Uganda bonds: no update"
        env:
          OMP_THREAD_LIMIT: "1"  # four notices are read at once: stop each Tesseract also spawning a thread per core
        continue-on-error: true
        timeout-minutes: 20
      # Publication latency: for each new bill and bond result, when our reader first wrote it and, where the publisher
      # gives one, when the publisher released it (data/latency.json, shown on /status). After every reader, before the
      # commit; the bond-alert step below reads it to find new bond auctions.
      - run: python scripts/latency.py
        continue-on-error: true
        timeout-minutes: 5
      # Is every figure as fresh as its publisher's rhythm says? Late or unread ones show as warnings on this run,
      # and data/health.json feeds /status and the desk.
      - run: python scripts/data_health.py
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        timeout-minutes: 2
      # New auction results, policy-rate changes and stories go to the Telegram channel. Before the commit, so the
      # record of what was posted (data/telegram_state.json) is saved with the data. The bot token and channel come
      # from the TELEGRAM_* secrets if set, otherwise from the database (af_telegram_config, behind AF_CRON_SECRET).
      - run: python scripts/telegram_post.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          AF_CRON_SECRET: ${{ secrets.AF_CRON_SECRET }}
        continue-on-error: true
        timeout-minutes: 3
      - name: Commit if the dataset changed
        run: |
          if git diff --quiet -- data && [ -z "$(git ls-files --others --exclude-standard data)" ]; then
            echo "No new auctions."
            exit 0
          fi
          git config user.name "afronomics-bot"
          git config user.email "afronomics-bot@users.noreply.github.com"
          git add data
          git commit -m "African auctions: add latest results"
          # main can move while the job runs (a merge, another job): replay this commit on top and retry
          for attempt in 1 2 3; do
            # Another run may have committed the same files meanwhile: this run read them last, so its copy of
            # any file both changed wins; files only one run changed merge as usual.
            if ! git pull --rebase origin main; then
              for f in $(git diff --name-only --diff-filter=U); do git checkout --theirs -- "$f" && git add "$f"; done
              GIT_EDITOR=true git rebase --continue || { git rebase --abort 2>/dev/null; false; }
            fi && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 10))
          done
          exit 1
      # Email rate alerts. Runs every time (it sends only what is new); after a data commit it first waits for the
      # site to deploy that commit, because the sender reads the data the live deployment carries.
      - name: Send email rate alerts
        env:
          AF_CRON_SECRET: ${{ secrets.AF_CRON_SECRET }}
        run: |
          if [ -z "$AF_CRON_SECRET" ]; then echo "AF_CRON_SECRET not set; skipping alerts"; exit 0; fi
          url=https://www.afronomicsfeed.com/api/send/rate-alerts
          head=$(git rev-parse HEAD)
          if [ "$head" != "$GITHUB_SHA" ]; then
            for attempt in $(seq 1 20); do
              deployed=$(curl -fsS -m 60 -X POST -H "Authorization: Bearer $AF_CRON_SECRET" "$url?dry=1" | python3 -c "import json,sys;print(json.load(sys.stdin).get('deployment') or '')" || true)
              if [ -n "$deployed" ] && { [ "$deployed" = "$head" ] || { git fetch -q --depth=50 origin main && git merge-base --is-ancestor "$head" "$deployed"; } 2>/dev/null; }; then break; fi
              echo "Waiting for the deploy of $head (live: ${deployed:-unknown})"
              sleep 30
            done
          fi
          curl -fsS --retry 2 --retry-delay 30 -m 300 -X POST -H "Authorization: Bearer $AF_CRON_SECRET" "$url"
      # Call it score emails: one to each reader who called the latest Kenya T-bill auction, after the rate-alert step
      # has waited for this run's data to deploy. Each guess is claimed before its email goes, so nothing goes twice;
      # before migration 0045 is applied it sends nothing.
      - name: Send Call it scores
        if: ${{ !cancelled() }}
        env:
          AF_CRON_SECRET: ${{ secrets.AF_CRON_SECRET }}
        run: |
          if [ -z "$AF_CRON_SECRET" ]; then echo "AF_CRON_SECRET not set; skipping"; exit 0; fi
          curl -fsS --retry 2 --retry-delay 30 -m 300 -X POST -H "Authorization: Bearer $AF_CRON_SECRET" https://www.afronomicsfeed.com/api/send/call-it
        continue-on-error: true
      # auction.published webhooks to data-licence holders (migration 0050): signed POSTs, claimed before sending so
      # nothing goes twice; with no subscriptions, or before 0050 is applied, it sends nothing. No email involved.
      - name: Send auction webhooks
        if: ${{ !cancelled() }}
        env:
          AF_CRON_SECRET: ${{ secrets.AF_CRON_SECRET }}
        run: |
          if [ -z "$AF_CRON_SECRET" ]; then echo "AF_CRON_SECRET not set; skipping"; exit 0; fi
          curl -fsS --retry 2 --retry-delay 30 -m 300 -X POST -H "Authorization: Bearer $AF_CRON_SECRET" https://www.afronomicsfeed.com/api/send/webhooks
        continue-on-error: true
      # Bond-result emails to API key holders (pilot and paid): one per market per auction day, for bond results this
      # or a recent run first saw (data/latency.json). Claimed in the database before each send, so nothing goes twice;
      # with no key holders, or before migration 0037 is applied, it sends nothing. After the rate-alert step, which
      # has already waited for this run's data to deploy.
      - name: Send bond-result alerts
        if: ${{ !cancelled() }}
        env:
          AF_CRON_SECRET: ${{ secrets.AF_CRON_SECRET }}
        run: |
          if [ -z "$AF_CRON_SECRET" ]; then echo "AF_CRON_SECRET not set; skipping"; exit 0; fi
          curl -fsS --retry 2 --retry-delay 30 -m 300 -X POST -H "Authorization: Bearer $AF_CRON_SECRET" https://www.afronomicsfeed.com/api/send/bond-alerts
        continue-on-error: true
